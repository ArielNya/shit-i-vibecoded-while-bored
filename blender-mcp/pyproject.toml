[project]
name = "blender-mcp"
version = "0.7.0"
description = "MCP server that lets AI agents inspect and model inside Blender"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["addon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
