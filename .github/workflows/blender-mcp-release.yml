name: blender-mcp release

# Push a tag like blender-mcp-v0.7.0 to publish a GitHub release with the Blender
# add-on zip and the server wheel/sdist. The tag must match the project version.
on:
  push:
    tags:
      - "blender-mcp-v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: blender-mcp

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Tag matches version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "blender-mcp-v${version}" || {
            echo "tag ${GITHUB_REF_NAME} != blender-mcp-v${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Checks
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests/unit -q

      - name: Build add-on and server
        run: |
          python3 scripts/build_addon.py
          uv build --out-dir dist
          ls -l dist

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${VERSION}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ### Install
          1. In Blender 4.2+: Edit → Preferences → Get Extensions → ⌄ → Install from Disk →
             `blender_mcp_addon-*.zip`, then 3D Viewport sidebar → MCP → Start.
          2. Server: `claude mcp add blender -- uvx --from <URL of the .whl below> blender-mcp`
             (or clone the repo and use `uv run --directory blender-mcp blender-mcp`).
          EOF
          test -s "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "blender-mcp ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
