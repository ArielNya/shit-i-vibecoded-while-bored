name: blender-mcp

on:
  push:
    paths:
      - "blender-mcp/**"
      - ".github/workflows/blender-mcp.yml"
  pull_request:
    paths:
      - "blender-mcp/**"
      - ".github/workflows/blender-mcp.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: blender-mcp

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit -q

  integration:
    # Real headless Blender via the bpy wheel; Mesa gives it software OpenGL for renders.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System libraries for bpy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1-mesa-dri libgles2 libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6
      - run: uv sync
      - name: Install Blender (bpy wheel)
        run: |
          uv venv -p 3.11 "$RUNNER_TEMP/bpyenv"
          uv pip install -p "$RUNNER_TEMP/bpyenv/bin/python" "bpy>=4.2,<4.3"
      - name: Integration tests
        env:
          BLENDER_PYTHON: ${{ runner.temp }}/bpyenv/bin/python
        run: uv run pytest tests/integration -q
