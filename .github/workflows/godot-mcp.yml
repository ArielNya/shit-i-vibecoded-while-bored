name: godot-mcp

on:
  push:
    paths:
      - "godot-mcp/**"
      - ".github/workflows/godot-mcp.yml"
  pull_request:
    paths:
      - "godot-mcp/**"
      - ".github/workflows/godot-mcp.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: godot-mcp

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit -q

  integration:
    # A real Godot editor: headless for most tests, under Xvfb (Mesa) for screenshots.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System libraries (Xvfb, Mesa)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libfontconfig1
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
      - run: uv sync
      - name: Integration tests
        run: |
          export GODOT_BIN="$(ls ~/godot/Godot_v*_linux.x86_64)"
          "$GODOT_BIN" --version
          uv run pytest tests/integration -q

  integration-next:
    # Early warning: the same tests on the newest Godot build (dev/beta/rc snapshots
    # included). Allowed to fail.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System libraries (Xvfb, Mesa)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libfontconfig1
      - name: Download the newest Godot build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/godotengine/godot-builds/releases --jq '.[0].tag_name')
          echo "Testing against Godot ${tag}"
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${tag}/Godot_v${tag}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
      - run: uv sync
      - name: Integration tests
        run: |
          export GODOT_BIN="$(ls ~/godot/Godot_v*_linux.x86_64)"
          "$GODOT_BIN" --version
          uv run pytest tests/integration -q
