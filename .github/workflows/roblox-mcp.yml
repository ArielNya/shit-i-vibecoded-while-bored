name: roblox-mcp

on:
  push:
    paths:
      - "roblox-mcp/**"
      - ".github/workflows/roblox-mcp.yml"
  pull_request:
    paths:
      - "roblox-mcp/**"
      - ".github/workflows/roblox-mcp.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: roblox-mcp

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit -q
      - name: Tool schemas portable to every major MCP client
        run: uv run python scripts/check_harness_schemas.py
