[project]
name = "godot-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents inspect, edit, run and debug Godot 4.7+ projects"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
godot-mcp = "godot_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
