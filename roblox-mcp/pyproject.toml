[project]
name = "roblox-mcp"
version = "0.1.0"
description = "Companion MCP server to Roblox Studio's built-in one: files, code checks, tests, asset uploads, publishing, offline API docs"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
roblox-mcp = "roblox_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roblox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
